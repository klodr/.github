name: Setup Node (MCP)
description: >
  Checkout the calling repo and provision Node.js with package-manager
  cache enabled, then install dependencies via npm/pnpm/yarn. Used by
  every job of every klodr/* MCP CI pipeline so a single bump of an
  action SHA propagates to all four MCPs at once.

inputs:
  node-version:
    description: Node.js version to provision (e.g. "22", "24").
    required: false
    default: "22"
  package-manager:
    description: Package manager driving the install step (npm | pnpm | yarn).
    required: false
    default: npm

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Setup Node ${{ inputs.node-version }}
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.package-manager }}

    - name: Install dependencies (npm)
      if: inputs.package-manager == 'npm'
      shell: bash
      run: npm ci

    - name: Install dependencies (pnpm)
      if: inputs.package-manager == 'pnpm'
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install dependencies (yarn)
      if: inputs.package-manager == 'yarn'
      shell: bash
      run: yarn install --frozen-lockfile
