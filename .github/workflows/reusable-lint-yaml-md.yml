# Reusable workflow: lint YAML and Markdown for klodr/* repos.
#
# Consumed via:
#   jobs:
#     lint-yaml-md:
#       uses: klodr/.github/.github/workflows/reusable-lint-yaml-md.yml@<sha>
#       with:
#         yamllint-config: .yamllint           # optional, default
#         markdownlint-config: .markdownlint.jsonc  # optional, default
#         markdownlint-globs: '**/*.md #node_modules' # optional, default
#
# Pin to a commit SHA, not @main, in production callers.

name: Reusable / Lint YAML & Markdown

on:
  workflow_call:
    inputs:
      yamllint-config:
        type: string
        default: ".yamllint"
        description: "Path to yamllint config file (relative to repo root)."
      markdownlint-config:
        type: string
        default: ".markdownlint.jsonc"
        description: "Path to markdownlint-cli2 config file (relative to repo root)."
      markdownlint-globs:
        type: string
        # `markdownlint-cli2-action` splits this input by NEWLINE (not by
        # space). The `#prefix` patterns are exclusions. The `.markdownlint`
        # config's `ignores` array is only honored when markdownlint-cli2
        # is invoked WITHOUT explicit globs, so we re-list common exclusions
        # here to make the default safe for callers that don't override.
        #
        # ⚠️ BEHAVIOUR CHANGE (PR #14): default was previously `'**/*.md'`
        # (single line, no exclusions). Callers that relied on the old
        # default linting CHANGELOG.md / node_modules / coverage / dist
        # should explicitly override with `markdownlint-globs: '**/*.md'`
        # to restore prior behaviour. The 5 klodr/* MCP+plugin callers
        # were updated to use the new default in the same release window.
        default: |
          **/*.md
          #CHANGELOG.md
          #node_modules
          #coverage
          #dist
        description: "Newline-separated glob patterns for markdownlint-cli2. `#prefix` excludes."
      yamllint-paths:
        type: string
        default: "."
        description: "Path(s) to scan with yamllint. Defaults to repo root."

jobs:
  lint:
    name: Lint YAML & Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # yamllint is a Python package and is the de-facto YAML linter
      # (semantic checks beyond pure formatting: duplicate keys, indent
      # consistency, line-length, truthy values, etc.). markdownlint-cli2
      # is the modern Node CLI for the markdownlint ruleset.
      - name: Setup Python (yamllint)
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"

      - name: Install yamllint
        run: pip install --user 'yamllint==1.38.0'

      - name: Run yamllint
        # Inputs come through env to avoid shell injection from caller-supplied
        # paths (a caller could set yamllint-paths to `.; malicious-command`).
        # `read -r -a` splits on whitespace into a bash array, then we expand
        # with proper quoting so each path is a separate argv to yamllint.
        shell: bash
        env:
          YAMLLINT_CONFIG: ${{ inputs.yamllint-config }}
          YAMLLINT_PATHS: ${{ inputs.yamllint-paths }}
        run: |
          set -euo pipefail
          read -r -a paths <<< "$YAMLLINT_PATHS"
          yamllint -c "$YAMLLINT_CONFIG" "${paths[@]}"

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
        with:
          config: ${{ inputs.markdownlint-config }}
          globs: ${{ inputs.markdownlint-globs }}
