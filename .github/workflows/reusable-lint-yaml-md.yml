# Reusable workflow: lint YAML and Markdown for klodr/* repos.
#
# Consumed via:
#   jobs:
#     lint-yaml-md:
#       uses: klodr/.github/.github/workflows/reusable-lint-yaml-md.yml@<sha>
#       with:
#         yamllint-config: .yamllint           # optional, default
#         markdownlint-config: .markdownlint.jsonc  # optional, default
#         markdownlint-globs: '**/*.md #node_modules' # optional, default
#
# Pin to a commit SHA, not @main, in production callers.

name: Reusable / Lint YAML & Markdown

on:
  workflow_call:
    inputs:
      yamllint-config:
        type: string
        default: '.yamllint'
        description: 'Path to yamllint config file (relative to repo root).'
      markdownlint-config:
        type: string
        default: '.markdownlint.jsonc'
        description: 'Path to markdownlint-cli2 config file (relative to repo root).'
      markdownlint-globs:
        type: string
        default: '**/*.md'
        description: 'Glob pattern of Markdown files to lint (passed to markdownlint-cli2).'
      yamllint-paths:
        type: string
        default: '.'
        description: 'Path(s) to scan with yamllint. Defaults to repo root.'

permissions:
  contents: read

jobs:
  lint:
    name: Lint YAML & Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # yamllint is a Python package and is the de-facto YAML linter
      # (semantic checks beyond pure formatting: duplicate keys, indent
      # consistency, line-length, truthy values, etc.). markdownlint-cli2
      # is the modern Node CLI for the markdownlint ruleset.
      - name: Setup Python (yamllint)
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'

      - name: Install yamllint
        run: pip install --user 'yamllint==1.38.0'

      - name: Run yamllint
        run: yamllint -c ${{ inputs.yamllint-config }} ${{ inputs.yamllint-paths }}

      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd # v23.2.0
        with:
          config: ${{ inputs.markdownlint-config }}
          globs: ${{ inputs.markdownlint-globs }}
