name: CI

# CI for the klodr/.github meta-repo. Every reusable workflow this repo
# ships is dogfooded here when possible, so a regression in a reusable
# is caught before it cascades to every klodr/* downstream consumer.
#
# Active jobs:
# - actionlint:    YAML/expression validation of every workflow + composite
#                  action.
# - gitleaks:      secret scan via the reusable shipped from this repo.
# - lint-yaml-md:  yamllint + markdownlint-cli2 via the reusable shipped
#                  from this repo (dogfood).
# - shellcheck:    static analysis of every shell template under
#                  `.github/templates/` (these are copied verbatim into
#                  every consumer repo, so a regression here ships
#                  silently to all of them).
#
# No status checks are wired into the `main` ruleset yet; that needs to
# happen in the GitHub UI after the workflow has run green at least once
# so the contexts exist on the branch.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: actionlint
        uses: reviewdog/action-actionlint@be0761e4c1bab7cfdfca56cd03d4bb6253e39a4a # v1.72.0
        with:
          # Plain `github-pr-check` mode would post review comments via
          # reviewdog; we just want a hard pass/fail status check here.
          reporter: github-check
          fail_level: error

  gitleaks:
    name: Gitleaks
    # Same-repo reusable workflow — explicit local reference per
    # GitHub docs: `uses: ./.github/workflows/<file>` (no @ref).
    uses: ./.github/workflows/reusable-gitleaks.yml

  lint-yaml-md:
    name: Lint YAML & Markdown
    # Dogfood the same reusable we expose to every klodr/* MCP consumer.
    # If `reusable-lint-yaml-md.yml` regresses, the check fails here
    # before consumers ever invoke it.
    uses: ./.github/workflows/reusable-lint-yaml-md.yml

  shellcheck:
    name: Shellcheck (shared templates)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run shellcheck
        # `shellcheck` is preinstalled on ubuntu-latest runners (no need
        # for an external action). Default severity is `style`; we keep
        # that — info-level findings (SC2016, SC2086 with intentional
        # word-splitting) are reported but exit 0.
        shell: bash
        run: |
          shellcheck --version
          shellcheck .github/templates/husky/pre-commit \
                     .github/templates/husky/pre-push
