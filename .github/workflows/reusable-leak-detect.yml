# Reusable workflow: scan a PR diff against the private leak-pattern
# repo (klodr/.github_private).
#
# Consumed via:
#   jobs:
#     leak-detect:
#       uses: klodr/.github/.github/workflows/reusable-leak-detect.yml@<sha>
#       secrets:
#         leak-detect-app-private-key: ${{ secrets.LEAK_DETECT_APP_PRIVATE_KEY }}
#
# The GitHub App backing those secrets must be installed on
# klodr/.github_private with:
#   - Repository permissions: Contents: Read
# Tokens generated below are scoped to that single repo, short-lived
# (one job run), and not bound to any user account.

name: Reusable / Leak detect (private patterns)

on:
  workflow_call:
    inputs:
      patterns-ref:
        type: string
        default: "main"
        description: "Branch / tag / SHA of klodr/.github_private to use."
    secrets:
      leak-detect-app-private-key:
        required: true
        description: "GitHub App private key (PEM) for the leak-detect bot."

permissions:
  contents: read

jobs:
  scan:
    name: Scan PR diff
    # Skip on any bot-authored PR (`<slug>[bot]` actor login).
    # Two reasons combined:
    #
    # 1. Bots can't reach the `leak-detect-app-private-key` secret —
    #    Dependabot has its own secret store and most GitHub-App bots
    #    run without access to standard Actions secrets, so the inline
    #    JWT signing step receives an empty APP_PRIVATE_KEY and fails
    #    before any scan runs.
    # 2. Bot PRs are not new external-contributor code paths: Dependabot
    #    bumps actions/deps, release-please carries a generated CHANGELOG
    #    + version bump, github-actions[bot] runs maintenance tasks the
    #    repo admins authored. At the bot-PR stage, anything secret-
    #    leaking would already have leaked upstream of this gate.
    #
    # Adding/replacing a bot requires admin write on the repo, so the
    # threat model that this filter enables (unscanned bot PRs) requires
    # an attacker who is already inside.
    if: >-
      github.event_name == 'pull_request'
      && !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Generate App installation token (inline JWT)
        # GitHub's per-installation token endpoints
        # (/repos/{owner}/{repo}/installation, /users/{user}/installation,
        # /app/installations/{id}/access_tokens) require the JWT `iss`
        # claim to be the integer App ID — they reject the
        # `Iv...`-prefix Client ID even though the GitHub docs present
        # Client ID as the recommended form for JWT auth in May 2026.
        # actions/create-github-app-token@v3.x reads its `app-id` /
        # `client-id` input via core.getInput() (always a string) and
        # forwards it to octokit-auth-app, which then signs the JWT
        # with iss=<string>. The result is HTTP 401 'iss must be an
        # Integer' on every install-scoped call. Both the v3.1.1 and
        # v3.2.0 input paths share this codepath; there is no input cast
        # we can apply that survives core.getInput().
        #
        # Sign the JWT directly with iss=App-ID-as-JSON-number, exchange
        # it for an installation token, mask the token, and expose it
        # via `steps.app-token.outputs.token` exactly like the action
        # used to. PyJWT + cryptography are available out of the box on
        # ubuntu-latest's python3.
        id: app-token
        shell: bash
        env:
          # App ID is hardcoded here on purpose: GitHub Actions masks
          # secret values at runtime even inside the step's env block
          # (the env var is literally "***" inside python), so the
          # secret-based path returns int('***') → ValueError. App IDs
          # are public anyway — visible on https://github.com/apps/<slug>
          # and in every JWT iss claim that ever ships. Only the
          # private key needs to be a secret.
          APP_ID: "3684272" # klodr-leak-detect
          APP_PRIVATE_KEY: ${{ secrets.leak-detect-app-private-key }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user 'PyJWT[crypto]==2.10.1'
          token=$(python3 - <<'PY'
          import json, os, sys, time, urllib.request
          import jwt

          app_id = int(os.environ['APP_ID'])
          private_key = os.environ['APP_PRIVATE_KEY']

          now = int(time.time())
          jwt_token = jwt.encode(
              {'iat': now - 60, 'exp': now + 540, 'iss': app_id},
              private_key,
              algorithm='RS256',
          )

          def gh(path, method='GET', body=None):
              req = urllib.request.Request(
                  f'https://api.github.com{path}',
                  data=(json.dumps(body).encode() if body else None),
                  method=method,
                  headers={
                      'Authorization': f'Bearer {jwt_token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'klodr-leak-detect-jwt',
                      **({'Content-Type': 'application/json'} if body else {}),
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read() or b'null')

          # Find the installation on klodr/.github_private specifically — the
          # App is also installed on the rest of klodr/* via "All repositories"
          # but this token only needs Contents:Read on the patterns repo.
          inst = gh('/repos/klodr/.github_private/installation')
          token = gh(
              f'/app/installations/{inst["id"]}/access_tokens',
              method='POST',
              body={'repositories': ['.github_private'],
                    'permissions': {'contents': 'read'}},
          )['token']
          sys.stdout.write(token)
          PY
          )
          # Mask the token in any subsequent log line + expose it as an
          # output for the rest of the workflow (same surface as
          # actions/create-github-app-token's `outputs.token`).
          echo "::add-mask::$token"
          echo "token=$token" >>"$GITHUB_OUTPUT"

      - name: Checkout caller repo (full history for diff)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout klodr/.github_private (patterns)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: klodr/.github_private
          ref: ${{ inputs.patterns-ref }}
          token: ${{ steps.app-token.outputs.token }}
          path: .leak-patterns-repo
          persist-credentials: false

      - name: Setup Node 22.22.2+ (klodr CVE-floor)
        # ubuntu-latest currently ships Node v20.x; klodr/.github_private's
        # package.json declares `engines.node: ">=22.22.2"` so the libphone
        # install below fails with EBADENGINE on the default runner Node.
        # Pin the exact engines floor (not just major "22") so a stale
        # cached 22.x < 22.22.2 on the runner does not slip through. The
        # version string here mirrors klodr/.github_private/package.json
        # engines and should be bumped in lockstep.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.22.2"
          check-latest: true

      - name: Install libphonenumber-js (phone validation in scan.sh)
        # scan.sh special-cases the `phone-*` patterns: a regex
        # pre-filter extracts 10-digit candidates, then
        # `scripts/validate-phones.mjs` re-validates each via
        # libphonenumber-js before a finding fires. Without the
        # dependency present, `validate-phones.mjs` throws
        # MODULE_NOT_FOUND on the first candidate and scan.sh `exit 2`s
        # — by design, since silently skipping the validator would
        # let unvalidated regex matches surface as findings (the very
        # bug this two-stage detection is meant to suppress).
        #
        # The dependency version is pinned HERE (not in the patterns
        # repo) so the install is independent of `inputs.patterns-ref`:
        # a caller pointing at a pre-libphonenumber ref still gets the
        # validator-side dep installed. `--prefix .leak-patterns-repo
        # --no-save --no-package-lock` drops a `node_modules/` next to
        # the script that imports it (ESM resolution walks parent
        # directories) without writing into the checkout's own
        # `package.json` / `package-lock.json`. `--ignore-scripts` is
        # defense-in-depth against any future transitive postinstall.
        # Node 22 is provisioned by the preceding setup-node step (the
        # default ubuntu-latest Node is v20, which would fail the
        # `engines.node: ">=22.22.2"` constraint on klodr/.github_private).
        env:
          LIBPHONENUMBER_VERSION: 1.13.1
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm install \
            --prefix .leak-patterns-repo \
            --no-save \
            --no-package-lock \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            "libphonenumber-js@${LIBPHONENUMBER_VERSION}"
          test -d .leak-patterns-repo/node_modules/libphonenumber-js

      - name: Install yq (YAML parser)
        run: |
          set -euo pipefail
          # yq from mikefarah, pinned + checksum-verified.
          #
          # mikefarah/yq's `checksums` file is multi-column (filename,
          # md5, sha1, sha256, bsd, …) — not the single-hash format
          # `sha256sum -c` expects. The companion file
          # `checksums_hashes_order` tells us which column carries the
          # SHA-256 digest, so we extract it explicitly instead of
          # piping the raw line through `sha256sum -c`.
          YQ_VERSION="v4.46.1"
          YQ_ASSET="yq_linux_amd64"
          BASE_URL="https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}"
          curl -fsSL -o "/tmp/${YQ_ASSET}" "${BASE_URL}/${YQ_ASSET}"
          curl -fsSL -o /tmp/checksums "${BASE_URL}/checksums"
          curl -fsSL -o /tmp/checksums_hashes_order \
            "${BASE_URL}/checksums_hashes_order"
          # Column 1 in `checksums` is the filename; subsequent columns
          # follow the order declared in `checksums_hashes_order`. Find
          # the SHA-256 line number, +1 to skip the filename column.
          sha256_line=$(grep -n '^SHA-256$' /tmp/checksums_hashes_order \
                        | cut -d: -f1 || true)
          if [ -z "$sha256_line" ]; then
            echo "leak-detect: unable to locate SHA-256 column in checksums_hashes_order" >&2
            exit 1
          fi
          sha256_col=$((sha256_line + 1))
          expected_sha=$(awk -v asset="$YQ_ASSET" -v c="$sha256_col" \
            '$1 == asset { print $c; exit }' /tmp/checksums)
          if ! printf '%s' "$expected_sha" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "leak-detect: unable to parse expected SHA-256 for ${YQ_ASSET}" >&2
            exit 1
          fi
          actual_sha=$(sha256sum "/tmp/${YQ_ASSET}" | awk '{print $1}')
          if [ "$expected_sha" != "$actual_sha" ]; then
            printf 'yq checksum mismatch: expected=%s actual=%s\n' \
              "$expected_sha" "$actual_sha" >&2
            exit 1
          fi
          sudo install -m 0755 "/tmp/${YQ_ASSET}" /usr/local/bin/yq
          yq --version

      - name: Run scanner against PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LEAK_PATTERNS_DIR: ${{ github.workspace }}/.leak-patterns-repo/leak-patterns
        run: |
          set -euo pipefail
          git diff "$BASE_SHA...$HEAD_SHA" \
            | bash .leak-patterns-repo/scripts/scan.sh

      # PR title, body and commit messages are not part of the git diff
      # but are equally public surface area on a public repo. Re-run the
      # scanner with those lines synthesised as added-diff lines (prefix
      # `+ `) so scan.sh's pattern matchers (hostnames, private repo
      # names, PII regexes, etc.) see them too.
      - name: Run scanner against PR metadata (title, body, commit messages)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LEAK_PATTERNS_DIR: ${{ github.workspace }}/.leak-patterns-repo/leak-patterns
        run: |
          set -euo pipefail
          {
            printf '+ %s\n' "${PR_TITLE}"
            # Body may be null when the PR has no description; treat it
            # as an empty string in that case so the heredoc doesn't break.
            printf '%s\n' "${PR_BODY:-}" | sed 's/^/+ /'
            # Walk every commit added by this PR. `%s%n%b` emits subject
            # line + an empty separator + body; we prefix every emitted
            # line with `+ ` via awk so the scanner picks them up the
            # same way it would a diff hunk.
            git log --format='%s%n%n%b' "${BASE_SHA}..${HEAD_SHA}" \
              | awk '{ print "+ " $0 }'
          } | bash .leak-patterns-repo/scripts/scan.sh
