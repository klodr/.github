# Reusable workflow: scan a PR diff against the private leak-pattern
# repo (klodr/.github_private).
#
# Consumed via:
#   jobs:
#     leak-detect:
#       uses: klodr/.github/.github/workflows/reusable-leak-detect.yml@<sha>
#       secrets:
#         leak-detect-client-id: ${{ secrets.LEAK_DETECT_CLIENT_ID }}
#         leak-detect-app-private-key: ${{ secrets.LEAK_DETECT_APP_PRIVATE_KEY }}
#
# The GitHub App backing those secrets must be installed on
# klodr/.github_private with:
#   - Repository permissions: Contents: Read
# Tokens generated below are scoped to that single repo, short-lived
# (one job run), and not bound to any user account.

name: Reusable / Leak detect (private patterns)

on:
  workflow_call:
    inputs:
      patterns-ref:
        type: string
        default: "main"
        description: "Branch / tag / SHA of klodr/.github_private to use."
    secrets:
      leak-detect-client-id:
        required: true
        description: "GitHub App Client ID for the leak-detect bot."
      leak-detect-app-private-key:
        required: true
        description: "GitHub App private key (PEM) for the leak-detect bot."

permissions:
  contents: read

jobs:
  scan:
    name: Scan PR diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Generate App token (owner-scoped to klodr)
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          # Use the owner-installation endpoint /users/klodr/installation
          # rather than the repo-scoped /repos/{owner}/{repo}/installation.
          # The repo-scoped path still requires the JWT iss claim to be
          # a JSON Integer (the App ID), even when called via the
          # `client-id` input — GitHub's "Client ID is the recommended
          # form" docs haven't been fully implemented server-side
          # (May 2026). Symptom: 401 "'Issuer' claim ('iss') must be
          # an Integer". Note that core.getInput() returns secrets as
          # strings, so wrapping with fromJSON() at the call site is a
          # no-op — the value still arrives as a string at the action.
          #
          # Dropping `repositories:` switches the action to
          # getTokenFromOwner, which calls /users/{owner}/installation —
          # an endpoint that accepts iss=Client-ID string. The resulting
          # token is scoped to the App's klodr installation (still
          # restricted by Repository permissions: Contents Read on
          # klodr/.github_private only) and lives one job.
          client-id: ${{ secrets.leak-detect-client-id }}
          private-key: ${{ secrets.leak-detect-app-private-key }}
          owner: klodr

      - name: Checkout caller repo (full history for diff)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout klodr/.github_private (patterns)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: klodr/.github_private
          ref: ${{ inputs.patterns-ref }}
          token: ${{ steps.app-token.outputs.token }}
          path: .leak-patterns-repo
          persist-credentials: false

      - name: Setup Node 22 (klodr CVE-floor convention)
        # ubuntu-latest currently ships Node v20.x; klodr/.github_private's
        # package.json declares `engines.node: ">=22.22.2"` so the libphone
        # install below fails with EBADENGINE on the default runner Node.
        # Pinning Node 22 here matches the klodr convention and the
        # composite action `setup-node-mcp` (default node-version: "22").
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install libphonenumber-js (phone validation in scan.sh)
        # scan.sh special-cases the `phone-*` patterns: a regex
        # pre-filter extracts 10-digit candidates, then
        # `scripts/validate-phones.mjs` re-validates each via
        # libphonenumber-js before a finding fires. Without the
        # dependency present, `validate-phones.mjs` throws
        # MODULE_NOT_FOUND on the first candidate and scan.sh `exit 2`s
        # — by design, since silently skipping the validator would
        # let unvalidated regex matches surface as findings (the very
        # bug this two-stage detection is meant to suppress).
        #
        # The dependency version is pinned HERE (not in the patterns
        # repo) so the install is independent of `inputs.patterns-ref`:
        # a caller pointing at a pre-libphonenumber ref still gets the
        # validator-side dep installed. `--prefix .leak-patterns-repo
        # --no-save --no-package-lock` drops a `node_modules/` next to
        # the script that imports it (ESM resolution walks parent
        # directories) without writing into the checkout's own
        # `package.json` / `package-lock.json`. `--ignore-scripts` is
        # defense-in-depth against any future transitive postinstall.
        # Node 22 is provisioned by the preceding setup-node step (the
        # default ubuntu-latest Node is v20, which would fail the
        # `engines.node: ">=22.22.2"` constraint on klodr/.github_private).
        env:
          LIBPHONENUMBER_VERSION: 1.13.1
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm install \
            --prefix .leak-patterns-repo \
            --no-save \
            --no-package-lock \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            "libphonenumber-js@${LIBPHONENUMBER_VERSION}"
          test -d .leak-patterns-repo/node_modules/libphonenumber-js

      - name: Install yq (YAML parser)
        run: |
          set -euo pipefail
          # yq from mikefarah, pinned + checksum-verified.
          #
          # mikefarah/yq's `checksums` file is multi-column (filename,
          # md5, sha1, sha256, bsd, …) — not the single-hash format
          # `sha256sum -c` expects. The companion file
          # `checksums_hashes_order` tells us which column carries the
          # SHA-256 digest, so we extract it explicitly instead of
          # piping the raw line through `sha256sum -c`.
          YQ_VERSION="v4.46.1"
          YQ_ASSET="yq_linux_amd64"
          BASE_URL="https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}"
          curl -fsSL -o "/tmp/${YQ_ASSET}" "${BASE_URL}/${YQ_ASSET}"
          curl -fsSL -o /tmp/checksums "${BASE_URL}/checksums"
          curl -fsSL -o /tmp/checksums_hashes_order \
            "${BASE_URL}/checksums_hashes_order"
          # Column 1 in `checksums` is the filename; subsequent columns
          # follow the order declared in `checksums_hashes_order`. Find
          # the SHA-256 line number, +1 to skip the filename column.
          sha256_line=$(grep -n '^SHA-256$' /tmp/checksums_hashes_order \
                        | cut -d: -f1 || true)
          if [ -z "$sha256_line" ]; then
            echo "leak-detect: unable to locate SHA-256 column in checksums_hashes_order" >&2
            exit 1
          fi
          sha256_col=$((sha256_line + 1))
          expected_sha=$(awk -v asset="$YQ_ASSET" -v c="$sha256_col" \
            '$1 == asset { print $c; exit }' /tmp/checksums)
          if ! printf '%s' "$expected_sha" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "leak-detect: unable to parse expected SHA-256 for ${YQ_ASSET}" >&2
            exit 1
          fi
          actual_sha=$(sha256sum "/tmp/${YQ_ASSET}" | awk '{print $1}')
          if [ "$expected_sha" != "$actual_sha" ]; then
            printf 'yq checksum mismatch: expected=%s actual=%s\n' \
              "$expected_sha" "$actual_sha" >&2
            exit 1
          fi
          sudo install -m 0755 "/tmp/${YQ_ASSET}" /usr/local/bin/yq
          yq --version

      - name: Run scanner against PR diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LEAK_PATTERNS_DIR: ${{ github.workspace }}/.leak-patterns-repo/leak-patterns
        run: |
          set -euo pipefail
          git diff "$BASE_SHA...$HEAD_SHA" \
            | bash .leak-patterns-repo/scripts/scan.sh

      # PR title, body and commit messages are not part of the git diff
      # but are equally public surface area on a public repo. Re-run the
      # scanner with those lines synthesised as added-diff lines (prefix
      # `+ `) so scan.sh's pattern matchers (hostnames, private repo
      # names, PII regexes, etc.) see them too.
      - name: Run scanner against PR metadata (title, body, commit messages)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LEAK_PATTERNS_DIR: ${{ github.workspace }}/.leak-patterns-repo/leak-patterns
        run: |
          set -euo pipefail
          {
            printf '+ %s\n' "${PR_TITLE}"
            # Body may be null when the PR has no description; treat it
            # as an empty string in that case so the heredoc doesn't break.
            printf '%s\n' "${PR_BODY:-}" | sed 's/^/+ /'
            # Walk every commit added by this PR. `%s%n%b` emits subject
            # line + an empty separator + body; we prefix every emitted
            # line with `+ ` via awk so the scanner picks them up the
            # same way it would a diff hunk.
            git log --format='%s%n%n%b' "${BASE_SHA}..${HEAD_SHA}" \
              | awk '{ print "+ " $0 }'
          } | bash .leak-patterns-repo/scripts/scan.sh
