# Reusable Node CI workflow for klodr/* repos.
#
# Covers the full surface used today across the 5 klodr/* MCP+plugin
# repos: lint+format job, build+test matrix job (Node 22 + 24),
# coverage upload via codecov OIDC, and best-effort codecov test
# analytics. Every step is opt-out via inputs — DEFAULTS reflect the
# current klodr/* MCP TS profile (build+test+coverage). Override only
# what differs (e.g. `enable-build-step: false` for a JS-only plugin).
#
# Consumed via:
#   jobs:
#     ci:
#       uses: klodr/.github/.github/workflows/reusable-node-ci.yml@<sha>
#       permissions:
#         contents: read
#         id-token: write   # required if enable-codecov-upload (default)
#       with:
#         codecov-slug: klodr/<repo>
#
# Pin to a commit SHA, not @main, in production callers.

name: Reusable / Node CI

on:
  workflow_call:
    inputs:
      # ---- Lint & Format job ----
      enable-lint-job:
        type: boolean
        default: true
        description: "Run the Lint & Format job."
      package-manager:
        type: string
        default: "npm"
        description: "Package manager for all jobs (npm, yarn, pnpm)."
      run-format-check:
        type: boolean
        default: true
        description: "Whether lint-format runs prettier --check (false for repos without prettier)."
      lint-node-version:
        type: string
        default: "22"
        description: "Node version used for the lint job."

      # ---- Build & Test job ----
      enable-build-test-job:
        type: boolean
        default: true
        description: "Run the Build & Test matrix job."
      build-test-job-name:
        type: string
        default: "Build & Test"
        description: "Job display name (must match ruleset required-status-checks)."
      node-versions:
        type: string
        default: '["22", "24"]'
        description: 'JSON array of Node versions (matrix). Example: ''["22"]'' or ''["22","24"]''.'
      enable-build-step:
        type: boolean
        default: true
        description: "Run `npm run build` before tests (false for plugins with no build step)."
      coverage-node-version:
        type: string
        default: "22"
        description: "Node version on which coverage runs. Other versions run plain `npm test`."
      coverage-strategy:
        type: string
        default: "node-version-only"
        description: |
          'node-version-only' (default): coverage only on coverage-node-version, plain test on others.
          'always': run `npm run test:coverage` on every matrix entry (no plain `npm test`).

      # ---- Coverage upload ----
      enable-codecov-upload:
        type: boolean
        default: true
        description: "Upload coverage to codecov via OIDC after tests on coverage-node-version."
      codecov-slug:
        type: string
        default: ""
        description: "Codecov slug (e.g. klodr/gmail-mcp). Required if enable-codecov-upload is true."

      # ---- Codecov Test Analytics (JUnit) ----
      enable-codecov-test-analytics:
        type: boolean
        default: true
        description: "Upload JUnit results to codecov test analytics. Best-effort: never blocks merge."
      test-analytics-junit-file:
        type: string
        default: "./test-results.junit.xml"
        description: "Path to JUnit XML produced by the test runner."
      test-analytics-fail-on-error:
        type: string
        default: "false"
        description: "Pass-through to codecov-test-analytics fail-on-error input."

      working-directory:
        type: string
        default: "."
        description: "Working directory for run steps."

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    if: inputs.enable-lint-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Setup Node (lint job)
        uses: klodr/.github/.github/actions/setup-node-mcp@cfc709297722fd29bb9e66a3d0f13529ba4d6295 # main @ 2026-05-10
        with:
          node-version: ${{ inputs.lint-node-version }}
          package-manager: ${{ inputs.package-manager }}

      - name: Lint & format
        uses: klodr/.github/.github/actions/lint-format@cfc709297722fd29bb9e66a3d0f13529ba4d6295 # main @ 2026-05-10
        with:
          package-manager: ${{ inputs.package-manager }}
          run-format-check: ${{ inputs.run-format-check && 'true' || 'false' }}

  build-test:
    name: ${{ inputs.build-test-job-name }} (Node ${{ matrix.node }})
    if: inputs.enable-build-test-job
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # codecov OIDC upload
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.node-versions) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Setup Node ${{ matrix.node }}
        uses: klodr/.github/.github/actions/setup-node-mcp@cfc709297722fd29bb9e66a3d0f13529ba4d6295 # main @ 2026-05-10
        with:
          node-version: ${{ matrix.node }}
          package-manager: ${{ inputs.package-manager }}

      - name: Build
        if: inputs.enable-build-step
        env:
          PM: ${{ inputs.package-manager }}
        run: '"$PM" run build'

      # Test routing:
      # - coverage-strategy='always'              -> always test:coverage
      # - coverage-strategy='node-version-only'   -> coverage on coverage-node-version, plain `<pm> run test` elsewhere
      - name: Test (with coverage)
        if: ${{ inputs.coverage-strategy == 'always' || matrix.node == inputs.coverage-node-version }}
        env:
          PM: ${{ inputs.package-manager }}
        run: '"$PM" run test:coverage'

      - name: Test (no coverage)
        if: ${{ inputs.coverage-strategy != 'always' && matrix.node != inputs.coverage-node-version }}
        env:
          PM: ${{ inputs.package-manager }}
        run: '"$PM" run test'

      - name: Upload coverage
        if: ${{ inputs.enable-codecov-upload && matrix.node == inputs.coverage-node-version }}
        uses: klodr/.github/.github/actions/codecov-upload@7a292dd655923e16a70e2a3dacda4b4035fc0443 # main @ 2026-07-04 (codecov-action v7)
        with:
          slug: ${{ inputs.codecov-slug }}

      # Test Analytics — best-effort:
      # - `always() && !cancelled()` so failed test runs still upload
      #   (the flaky-test dashboard is most useful exactly then)
      # - `continue-on-error: true` catches wrapper / runtime failures
      #   that bypass codecov-action's `fail_ci_if_error` input
      # - `fail-on-error` defaults to `'false'` for the same reason
      - name: Upload test analytics
        if: ${{ always() && inputs.enable-codecov-test-analytics && matrix.node == inputs.coverage-node-version && !cancelled() }}
        continue-on-error: true
        uses: klodr/.github/.github/actions/codecov-test-analytics@cfc709297722fd29bb9e66a3d0f13529ba4d6295 # main @ 2026-05-10
        with:
          slug: ${{ inputs.codecov-slug }}
          files: ${{ inputs.test-analytics-junit-file }}
          fail-on-error: ${{ inputs.test-analytics-fail-on-error }}
